<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS - HYDRATION</title>
    <style>

        /* GOOD COLORS */
        /* #603dd0 ,  #6697a6 */
        :root {
            --btns: #469cb6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
            padding-top: 8px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            opacity: 0.6;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
        }


        
        .date-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .date-strip::-webkit-scrollbar { display: none; }

        .date-pill {
            flex: 0 0 auto;
            min-width: 44px;
            height: 44px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #9499a5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .date-pill:active {
            opacity: 0.8;
        }

        .date-pill.active {
            background: var(--btns);
            color: #000000;
            border-color: var(--btns);
            box-shadow: 0 0 12px rgba(66, 146, 226, 0.3);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card-title {
            font-size: 13px;
            color: #9499a5;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 600;
        }

        .metric-unit {
            font-size: 13px;
            color: #9499a5;
        }

        .card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-ring {
            width: 64px;
            height: 64px;
        }

        .progress-ring circle {
            fill: transparent;
            stroke-width: 5;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .bg-ring { stroke: rgba(255, 255, 255, 0.1); }
        .accent-ring {
            stroke: var(--btns);
            stroke-dasharray: 132;
            stroke-dashoffset: 132;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .stepper-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .stepper-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .step-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(23, 49, 87, 0.341);
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .step-btn:active { background: rgba(255, 255, 255, 0.25); }

        .log-main-btn {
            background: var(--btns);
            color: black;
            border: none;
            padding: 10px 28px;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 14px rgba(23, 49, 87, 0.341);
        }

        .log-main-btn:active { transform: scale(0.95); }

        .undo-link {
            background: none;
            border: none;
            padding: 4px 8px;
            color: #8a8f9d;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .undo-link:active {
            color: #f87171;
            opacity: 0.8;
        }

        .range-strip {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .range-pill {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: #9499a5;
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .range-pill:active {
            opacity: 0.7;
        }

        .range-pill.active {
            background: var(--btns);
            color: #000000;
        }

        .graph-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chart-container {
            width: 100%;
            height: 150px;
            position: relative;
        }

        .graph-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .graph-path {
            fill: none;
            stroke: var(--btns);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .graph-grid-line {
            stroke: rgba(255, 255, 255, 0.08);
            stroke-dasharray: 3;
        }

        .axis-text {
            fill: #717680;
            font-size: 10px;
            font-weight: 500;
        }


        .wide-card { width: 100%; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-badge {
            font-size: 11px;
            color: #717680;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .table-container {
            max-height: 180px;
            overflow-y: auto;
        }

        .table-container::-webkit-scrollbar { width: 4px; }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .history-table th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            color: #717680;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .history-table td {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .time-cell { color: #9499a5; }
        .amount-cell {
            font-weight: 600;
            color: var(--btns);
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <button class="back-btn" onclick="window.location.href='/'">&larr;</button>
            <span>Hydration Tracker</span>
        </div>

        <!-- DATE STRIP -->
        <div class="date-strip" id="date-strip"></div>

        <!-- METRICS SUMMARY CARDS -->
        <div class="cards-grid">
            <div class="glass-card">
                <div class="card-title">Water Intake</div>
                <div class="card-content">
                    <div>
                        <span class="metric-value" id="total-water">0</span>
                        <span class="metric-unit">ml</span>
                        <div class="card-title" style="margin-top: 6px;" id="goal-percentage">0% of Goal</div>
                    </div>
                    <svg class="progress-ring" viewBox="0 0 52 52">
                        <circle class="bg-ring" cx="26" cy="26" r="21"></circle>
                        <circle class="accent-ring" id="ring" cx="26" cy="26" r="21"></circle>
                    </svg>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-title">Your Average intake</div>
                <div style="margin-top: 12px;">
                    <span class="metric-value" id="average-water">0</span>
                    <span class="metric-unit">ml/day</span>
                </div>
            </div>
        </div>

        <!-- WATER STEPPER LOGGING CARD -->
        <div class="glass-card stepper-card">
            <div class="card-title">Custom Water Log:</div>
            <div class="stepper-controls">
                <button class="step-btn" onclick="adjustDose(-25)">&minus;</button>
                <button class="log-main-btn" id="log-btn" onclick="logWater()">245 ml</button>
                <button class="step-btn" onclick="adjustDose(25)">&plus;</button>
            </div>
            
            <button class="undo-link" onclick="undoLastLog()">
                &#x21A9; Undo last log
            </button>
        </div>

        <!-- RANGE SELECTOR -->
        <div class="range-strip">
            <div class="range-pill active" onclick="setRange('1d', this)">1d</div>
            <div class="range-pill" onclick="setRange('1w', this)">1w</div>
            <div class="range-pill" onclick="setRange('1m', this)">1m</div>
        </div>

        <!-- GRAPH CARD -->
        <div class="glass-card graph-card">
            <div class="card-title">Hydration Trend</div>
            <div class="chart-container">
                <svg class="graph-svg" id="graph-svg" viewBox="0 0 350 140" preserveAspectRatio="none">
                    <line x1="35" y1="20" x2="340" y2="20" class="graph-grid-line" />
                    <line x1="35" y1="60" x2="340" y2="60" class="graph-grid-line" />
                    <line x1="35" y1="100" x2="340" y2="100" class="graph-grid-line" />

                    <!-- FIX: Added IDs to Y-axis text nodes to allow JS dynamic scale updates -->
                    <text x="0" y="24" class="axis-text" id="y-axis-top">2.5L</text>
                    <text x="0" y="64" class="axis-text" id="y-axis-mid">1.2L</text>
                    <text x="12" y="104" class="axis-text" id="y-axis-bottom">0L</text>

                    <path d="" class="graph-path" id="graph-path" />
                    <g id="x-axis-labels"></g>
                </svg>
            </div>
        </div>

        <!-- RECENT LOGS TABLE CARD -->
        <div class="glass-card wide-card">
            <div class="card-header">
                <span class="card-title" style="margin-bottom: 0;">Recent Logs</span>
                <span class="history-badge" id="log-count">0 logged</span>
            </div>
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Time Logged</th>
                            <th style="text-align: right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="history-rows">
                        <tr>
                            <td colspan="2" style="text-align: center; color: #717680; padding: 16px 0;">Loading...</td>        
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        //  Done with AI, couldnt figure out java, since i have to learn it, I dont feel i can in this time period, but i tried to understand it
        function getLocalDateString(dateObj = new Date()) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        let activeDate = getLocalDateString();
        let currentDose = parseInt("{{ default_dose or 245 }}") || 245;
        let activeRange = '1d';

        function initDateStrip() {
            const strip = document.getElementById('date-strip');
            strip.innerHTML = '';
            const today = new Date();

            for (let i = 13; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const isoDate = getLocalDateString(d);
                const dayNum = d.getDate();

                const pill = document.createElement('div');
                pill.className = `date-pill ${isoDate === activeDate ? 'active' : ''}`;
                pill.innerText = dayNum;
                pill.onclick = () => {
                    document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeDate = isoDate;
                    refreshAll();
                };
                strip.appendChild(pill);
            }

            setTimeout(() => {
                const activePill = strip.querySelector('.date-pill.active');
                if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
        }

        function adjustDose(delta) {
            currentDose = Math.max(25, currentDose + delta);
            document.getElementById('log-btn').innerText = `${currentDose} ml`;
        }

        function logWater() {

            fetch(`/log/water?value=${currentDose}&date=${activeDate}`, { method: 'POST' })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(() => refreshAll())
                .catch(err => console.error("Logging error:", err));
        }

        function undoLastLog() {
            fetch(`/log/water/undo?date=${activeDate}`, { method: 'DELETE' })
                .then(res => {
                    if (!res.ok) throw new Error("Server rejected undo request");
                    return res.text(); 
                })
                .then(() => {
                    refreshAll();
                })
                .catch(err => console.error("Undo error:", err));
        }

        function setRange(range, el) {
            document.querySelectorAll('.range-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            activeRange = range;
            loadAnalytics();
        }

        function loadSummary() {
            fetch(`/summary/water?date=${activeDate}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    document.getElementById('total-water').innerText = data.total_ml ?? data.total ?? 0;
                    document.getElementById('average-water').innerText = data.average_ml ?? data.average ?? 0;
                    
                    const pct = data.percentage ?? 0;
                    document.getElementById('goal-percentage').innerText = `${pct}% of Goal`;

                    const ring = document.getElementById('ring');
                    const circumference = 2 * Math.PI * 21;
                    const offset = circumference - (pct / 100) * circumference;
                    ring.style.strokeDashoffset = Math.max(0, offset);
                })
                .catch(err => console.error("Summary error:", err));
        }

        function formatTimestamp(rawStr) {
            if (!rawStr) return "--:--";
            const normalized = rawStr.replace('T', ' ');
            const [dateStr, timeStr] = normalized.split(' ');
            if (!timeStr) return rawStr;

            const hhmm = timeStr.slice(0, 5);
            const todayStr = getLocalDateString();

            return (dateStr === todayStr) ? `${hhmm} - Today` : `${hhmm} - ${dateStr.slice(5)}`;
        }

        function loadHistory() {
            fetch(`/logs/water?date=${activeDate}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(logs => {
                    const tbody = document.getElementById('history-rows');
                    const logList = Array.isArray(logs) ? logs : (logs.history || logs.logs || []);
                    
                    document.getElementById('log-count').innerText = `${logList.length} logged`;

                    if (!logList || logList.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #717680; padding: 16px 0;">No entries recorded for this date</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = logList.map(log => {
                        const val = log.value ?? log.amount ?? log.ml ?? 0;
                        const unit = log.unit || 'ml';
                        const ts = log.timestamp || log.created_at || log.time || '';
                        return `
                            <tr>
                                <td class="time-cell">${formatTimestamp(ts)}</td>
                                <td class="amount-cell">+${val} ${unit}</td>
                            </tr>
                        `;
                    }).join('');
                })
                .catch(err => console.error("History error:", err));
        }

        function loadAnalytics() {
            fetch(`/analytics/water?range=${activeRange}&date=${activeDate}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    const path = document.getElementById('graph-path');
                    const xAxisGroup = document.getElementById('x-axis-labels');
                    xAxisGroup.innerHTML = '';

                    const pointsArray = Array.isArray(data) ? data : (data.points || data.history || []);

                    if (!pointsArray || pointsArray.length === 0) {
                        path.setAttribute('d', 'M 35 100 L 340 100');
                        return;
                    }

                    // Auto-scale Y-axis range
                    const maxVal = Math.max(...pointsArray.map(p => p.total_ml || p.ml || p.value || 0));
                    const maxGoal = Math.max(2500, maxVal * 1.1); // 10% padding

                    const topLabel = (maxGoal / 1000).toFixed(1) + 'L';
                    const midLabel = (maxGoal / 2000).toFixed(1) + 'L';
                    document.getElementById('y-axis-top').textContent = topLabel;
                    document.getElementById('y-axis-mid').textContent = midLabel;

                    const xStart = 35;
                    const xEnd = 340;
                    const yTop = 20;
                    const yBottom = 100;
                    const availableWidth = xEnd - xStart;

                    if (pointsArray.length === 1) {
                        const val = pointsArray[0].total_ml || pointsArray[0].ml || pointsArray[0].value || 0;
                        const y = yBottom - (val / maxGoal) * (yBottom - yTop);
                        path.setAttribute('d', `M ${xStart} ${y} L ${xEnd} ${y}`);

                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.setAttribute("x", (xStart + xEnd) / 2);
                        text.setAttribute("y", "125");
                        text.setAttribute("class", "axis-text");
                        text.setAttribute("text-anchor", "middle");
                        
                        let labelVal = String(pointsArray[0].hour || pointsArray[0].date || pointsArray[0].timestamp || 'Today');
                        if (labelVal.includes('T')) labelVal = labelVal.split('T')[1].slice(0, 5);
                        text.textContent = labelVal;
                        xAxisGroup.appendChild(text);
                        return;
                    }

                    const stepX = availableWidth / (pointsArray.length - 1);

   
                    const points = pointsArray.map((item, idx) => {
                        const val = item.total_ml || item.ml || item.value || 0;
                        const x = xStart + (idx * stepX);
                        const y = yBottom - (val / maxGoal) * (yBottom - yTop);
                        return { x, y, label: item.hour || item.date || item.timestamp || '' };
                    });

                    // Draw the SVG path
                    const pathStr = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                    path.setAttribute('d', pathStr);

                    // Smart X-Axis Labeling based on range selection
                    let labelInterval = 1;
                    if (activeRange === '1d') labelInterval = Math.max(1, Math.floor(points.length / 5)); 
                    else if (activeRange === '1w') labelInterval = 1; // Show all 7 days
                    else if (activeRange === '1m') labelInterval = Math.max(1, Math.floor(points.length / 6));

                    points.forEach((p, i) => {
                        if (i % labelInterval === 0 || i === points.length - 1) {
                            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                            text.setAttribute("x", p.x);
                            text.setAttribute("y", "125");
                            text.setAttribute("class", "axis-text");
                            text.setAttribute("text-anchor", "middle");

                            let displayLabel = String(p.label);

                            if (activeRange === '1d') {
                                if (displayLabel.includes('T')) displayLabel = displayLabel.split('T')[1].slice(0, 5);
                            } else {
                                if (displayLabel.includes('T')) displayLabel = displayLabel.split('T')[0];
                                if (displayLabel.includes('-')) {
                                    const parts = displayLabel.split('-');
                                    if (parts.length === 3) displayLabel = `${parts[1]}/${parts[2]}`;
                                }
                            }

                            text.textContent = displayLabel;
                            xAxisGroup.appendChild(text);
                        }
                    });
                })
                .catch(err => console.error("Analytics graph error:", err));
        }

        function refreshAll() {
            loadSummary();
            loadHistory();
            loadAnalytics();
        }

        initDateStrip();
        refreshAll();
    </script>
</body>
</html>
